name: Build edge OCI image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-edge.yml
      - .github/workflows/release.yml
      - builder/**
      - licenses/**
      - manifest/**
      - patches/**
      - runtime/guest/**
      - scripts/**
      - lib/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: arm64-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Report native runner capacity
        run: |
          uname -a
          docker version
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild sanitized ARM64 OCI image
        id: build
        run: |
          version="edge-${GITHUB_SHA:0:12}"
          ./builder/ci/build-rootfs.sh "$version"

      - name: Tag and push OCI image to GitHub Container Registry
        id: push
        env:
          VERSION: ${{ steps.build.outputs.version }}
          IMAGE_LOCAL: omarchy-android-ci:${{ steps.build.outputs.version }}
          REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          oci_reference="${REPOSITORY}:edge"
          oci_digest_reference="${REPOSITORY}@sha256:$(docker inspect --format '{{.Id}}' "$IMAGE_LOCAL" | sed 's/^sha256://')"
          # Floating 'edge' tag — every successful build overwrites it.
          docker tag "$IMAGE_LOCAL" "$oci_reference"
          docker push "$oci_reference"
          # Pinned-per-build tag so consumers can pin a specific commit.
          docker tag "$IMAGE_LOCAL" "${REPOSITORY}:${VERSION}"
          docker push "${REPOSITORY}:${VERSION}"
          manifest_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$oci_reference" | sed -e 's|^[^@]*@||')"
          printf 'manifest_digest=%s\n' "$manifest_digest" >> "$GITHUB_OUTPUT"
          printf 'oci_reference=%s\n' "$oci_reference" >> "$GITHUB_OUTPUT"
          printf 'oci_digest_reference=%s\n' "$oci_digest_reference" >> "$GITHUB_OUTPUT"
          printf 'image_tag=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload package drift evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-drift-${{ steps.build.outputs.image_tag }}
          path: .work/ci-image-${{ steps.build.outputs.image_tag }}/output/packages-aarch64-*.lock
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload OCI image, manifest, inventory, and checksums
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: omarchy-android-edge-${{ steps.build.outputs.image_tag }}
          path: .work/ci-image-${{ steps.build.outputs.image_tag }}/output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0