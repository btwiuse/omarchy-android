name: Publish installable release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      precompile_tag:
        description: 'Specific precompile build to release from (e.g. precompile-abc123def0). Defaults to :precompile.'
        required: false
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: arm64-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build the release image on top of :precompile
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out tagged release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve precompile image reference
        id: resolve
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.precompile_tag }}
          VERSION_REF: ${{ github.ref_name }}
        run: |
          # The precompile workflow pushes two GHCR tags: a floating
          # ':precompile' and a per-build pinned 'precompile-<sha>'. By
          # default we publish from the rolling ':precompile'; a
          # workflow_dispatch run can pin to a specific precompile build by
          # passing precompile_tag.
          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            precompile_tag="$REQUESTED_TAG"
          else
            precompile_tag="precompile"
          fi
          version="${VERSION_REF#v}"
          if [[ -n "$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version_tag="$version"
          else
            version_tag="$precompile_tag"
          fi
          printf 'precompile_tag=%s\n' "$precompile_tag" >> "$GITHUB_OUTPUT"
          printf 'precompile_reference=ghcr.io/%s:%s\n' "$GITHUB_REPOSITORY" "$precompile_tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'oci_reference=ghcr.io/%s:%s\n' "$GITHUB_REPOSITORY" "$version_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the precompile image and capture its digest
        env:
          PRECOMPILE_REFERENCE: ${{ steps.resolve.outputs.precompile_reference }}
        run: |
          docker pull --platform linux/arm64 "$PRECOMPILE_REFERENCE"
          precompile_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$PRECOMPILE_REFERENCE" | sed -e 's/^[^@]*@//')"
          printf 'precompile_digest=%s\n' "$precompile_digest" >> "$GITHUB_ENV"

      - name: Download the host payload archive
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION_REF: ${{ github.ref_name }}
        run: |
          mkdir -p image-output host-payload
          host_record="$(awk -F '|' '$1=="android-host" {print; found=1; exit} END {if (!found) exit 1}' "$GITHUB_WORKSPACE/manifest/host-artifacts.lock")"
          IFS='|' read -r _ _ host_url host_sha256 _ <<<"$host_record"
          host_archive="$GITHUB_WORKSPACE/${host_url##*/}"
          curl --fail --location --retry 3 --output "$host_archive" "$host_url"
          actual_sha="$(sha256sum "$host_archive" | awk '{print $1}')"
          [[ "$actual_sha" == "$host_sha256" ]] \
            || { echo "Host payload checksum mismatch" >&2; exit 1; }
          tar -xf "$host_archive" -C host-payload
          # The archive lands with host/bin, host/opt, etc. at the top level.
          # assemble-bundle.sh on the CI side expects the same shape under
          # the IMAGE_OUTPUT directory; for the Dockerfile.build path we
          # need it staged at /tmp/host-payload with the inner host/ subdir.
          rm -rf host-payload-staging
          mkdir -p host-payload-staging
          cp -a host-payload/. host-payload-staging/
          rm -rf host-payload

      - name: Build the release image on top of :precompile
        env:
          PRECOMPILE_REFERENCE: ${{ steps.resolve.outputs.precompile_reference }}
          PRECOMPILE_DIGEST: ${{ env.precompile_digest }}
          OCI_REFERENCE: ${{ steps.resolve.outputs.oci_reference }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          docker buildx build \
              --platform linux/arm64 \
              --pull=false \
              --tag "$OCI_REFERENCE" \
              --build-arg "PRECOMPILE_IMAGE=$PRECOMPILE_REFERENCE" \
              --build-arg "HOST_PAYLOAD_DIR=$GITHUB_WORKSPACE/host-payload-staging" \
              --build-arg "VERSION=$VERSION" \
              --build-arg "OCI_MANIFEST_DIGEST=$PRECOMPILE_DIGEST" \
              --label "org.opencontainers.image.title=Omarchy Android" \
              --label "org.opencontainers.image.version=$VERSION" \
              --file builder/ci/Dockerfile.release \
              "$GITHUB_WORKSPACE"
          docker push "$OCI_REFERENCE"
          published_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$OCI_REFERENCE" | sed -e 's/^[^@]*@//')"
          printf 'oci_manifest_digest=%s\n' "$published_digest" >> "$GITHUB_ENV"

      - name: Export the published image as an OCI tarball
        run: |
          mkdir -p image-output
          docker save -o image-output/release.oci.tar "$OCI_REFERENCE"

      - name: Upload release image and host payload as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: omarchy-android-release-${{ steps.resolve.outputs.version }}
          path: |
            image-output/release.oci.tar
            host-payload-staging/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GH release and lock
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: omarchy-android-release-${{ needs.image.outputs.version }}
          path: release/

      - name: Verify OCI tarball layout
        run: |
          cd "$GITHUB_WORKSPACE"
          for required in oci-layout index.json manifest.json; do
            tar -tf release/release.oci.tar | grep -qxF "$required" \
              || { printf 'OCI tarball missing %s\n' "$required" >&2; exit 1; }
          done

      - name: Assemble the host bundle
        env:
          VERSION: ${{ needs.image.outputs.version }}
          OCI_REFERENCE: ${{ needs.image.outputs.oci_reference }}
          OCI_MANIFEST_DIGEST: ${{ needs.image.outputs.oci_manifest_digest }}
        run: |
          mkdir -p release
          base_repository="$(awk -F'|' '$1=="archlinuxarm" {print $2}' "$GITHUB_WORKSPACE/manifest/oci-images.lock")"
          base_tag="$(awk -F'|' '$1=="archlinuxarm" {print $3}' "$GITHUB_WORKSPACE/manifest/oci-images.lock")"
          base_manifest="$(awk -F'|' '$1=="archlinuxarm" {print $4}' "$GITHUB_WORKSPACE/manifest/oci-images.lock")"
          base_layer="$(awk -F'|' '$1=="archlinuxarm" {print $5}' "$GITHUB_WORKSPACE/manifest/oci-images.lock")"
          printf 'format=2\nversion=%s\narchitecture=aarch64\n' "$VERSION" > release/IMAGE-MANIFEST
          printf 'oci_repository=%s\n' "${OCI_REFERENCE%:*}" >> release/IMAGE-MANIFEST
          printf 'oci_reference=%s\n' "$OCI_REFERENCE" >> release/IMAGE-MANIFEST
          printf 'oci_manifest_digest=%s\n' "$OCI_MANIFEST_DIGEST" >> release/IMAGE-MANIFEST
          printf 'base_repository=%s\n' "$base_repository" >> release/IMAGE-MANIFEST
          printf 'base_tag=%s\n' "$base_tag" >> release/IMAGE-MANIFEST
          printf 'base_manifest=%s\n' "$base_manifest" >> release/IMAGE-MANIFEST
          printf 'base_layer=%s\n' "$base_layer" >> release/IMAGE-MANIFEST
          ./builder/ci/assemble-bundle.sh \
            "$VERSION" \
            release/ \
            "$GITHUB_WORKSPACE/.work/ci-release-$VERSION"

      - name: Publish host payload as a GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          tag="v$VERSION"
          asset="omarchy-android-host-aarch64-$VERSION.tar.xz"
          bundle="$GITHUB_WORKSPACE/.work/ci-release-$VERSION/$asset"
          sidecar="$bundle.sha256"
          bundle_sha256="$(sha256sum "$bundle")"
          bundle_sha256="${bundle_sha256%% *}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for path in "$bundle" "$sidecar"; do
              name="${path##*/}"
              remote_digest="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq ".assets[] | select(.name == \"$name\") | .digest")"
              if [[ -z "$remote_digest" ]]; then
                gh release upload "$tag" "$path" --repo "$GITHUB_REPOSITORY"
              elif [[ "$remote_digest" != "sha256:$(sha256sum "$path" | awk '{print $1}')" ]]; then
                printf 'Refusing to replace mismatched release asset %s.\n' "$name" >&2
                exit 1
              fi
            done
          else
            notes_file="$(mktemp)"
            cat > "$notes_file" <<EOF
          Precompiled Omarchy Android $tag for ARM64 phones and tablets.

          The guest rootfs is published as an OCI image; proot-distro fetches, verifies, and unpacks it directly from GitHub Container Registry. The host payload archive above contains only the Android-side helpers (Termux Weston module, two native helpers, licenses). The installer verifies both before use.

          Users do not compile Mesa, Hyprland, Weston, or Omarchy. Follow the README from the top, then run the installer.

          This is an unofficial port; upstream project licenses and trademarks remain with their owners.
          EOF
            gh release create "$tag" "$bundle" "$sidecar" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --latest \
              --title "Omarchy Android $tag" \
              --notes-file "$notes_file"
            rm "$notes_file"
          fi

          remote_digest="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")"
          [[ "$remote_digest" == "sha256:$bundle_sha256" ]]
          printf 'host_bundle_sha256=%s\n' "$bundle_sha256" >> "$GITHUB_ENV"
          printf 'host_bundle_asset=%s\n' "$asset" >> "$GITHUB_ENV"

      - name: Point the installer at the published release
        env:
          VERSION: ${{ needs.image.outputs.version }}
          OCI_REFERENCE: ${{ needs.image.outputs.oci_reference }}
          OCI_MANIFEST_DIGEST: ${{ needs.image.outputs.oci_manifest_digest }}
          HOST_BUNDLE_ASSET: omarchy-android-host-aarch64-${{ needs.image.outputs.version }}.tar.xz
        run: |
          default_branch="$(git symbolic-ref --short refs/remotes/origin/HEAD \
            | sed 's|^origin/||')"
          : "${default_branch:=main}"
          git fetch --depth 1 origin "$default_branch"
          git switch --force-create "$default_branch" "origin/$default_branch"
          ./scripts/update-release-lock.sh \
            "$VERSION" \
            "$GITHUB_REPOSITORY" \
            "$oci_reference" \
            "$oci_manifest_digest" \
            "$HOST_BUNDLE_ASSET" \
            "$host_bundle_sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest/release.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Point installer at v$VERSION"
          git push origin "HEAD:$default_branch"