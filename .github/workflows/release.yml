name: Publish installable release

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - .github/workflows/release.yml
      - builder/**
      - licenses/**
      - manifest/**
      - runtime/guest/**
      - scripts/**
      - lib/**
  workflow_dispatch:
    inputs:
      precompile_tag:
        description: 'Specific precompile build to release from (e.g. precompile-abc123def0). Defaults to :precompile.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: arm64-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish installable release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out tagged release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve precompile image reference
        id: resolve
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.precompile_tag }}
          VERSION_REF: ${{ github.ref_name }}
        run: |
          # The precompile workflow pushes two GHCR tags: a floating
          # ':precompile' and a per-build pinned 'precompile-<sha>'. By
          # default we publish from the rolling ':precompile'; a
          # workflow_dispatch run can pin to a specific precompile build by
          # passing precompile_tag.
          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            precompile_tag="$REQUESTED_TAG"
          else
            precompile_tag="precompile"
          fi
          # The release workflow pushes its output under a separate tag so
          # it never overwrites the precompile artifact the next build
          # uses as input. For a tagged release (vX.Y.Z) we use the bare
          # semver so install.sh picks it up via the /releases/latest
          # redirect. For a workflow_dispatch run we use the ref name
          # itself so a rolling tag tracks the latest release-built
          # image.
          version="${VERSION_REF#v}"
          if [[ -n "$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version_tag="$version"
          else
            version_tag="$VERSION_REF"
          fi
          printf 'precompile_tag=%s\n' "$precompile_tag" >> "$GITHUB_OUTPUT"
          printf 'precompile_reference=ghcr.io/%s:%s\n' "$GITHUB_REPOSITORY" "$precompile_tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'version_tag=%s\n' "$version_tag" >> "$GITHUB_OUTPUT"
          printf 'oci_reference=ghcr.io/%s:%s\n' "$GITHUB_REPOSITORY" "$version_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the precompile image and capture its digest
        id: precompile
        env:
          PRECOMPILE_REFERENCE: ${{ steps.resolve.outputs.precompile_reference }}
        run: |
          docker pull --platform linux/arm64 "$PRECOMPILE_REFERENCE"
          precompile_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$PRECOMPILE_REFERENCE" | sed -e 's/^[^@]*@//')"
          printf 'precompile_digest=%s\n' "$precompile_digest" >> "$GITHUB_OUTPUT"

      - name: Build the release image on top of :precompile
        id: build
        env:
          PRECOMPILE_REFERENCE: ${{ steps.resolve.outputs.precompile_reference }}
          PRECOMPILE_DIGEST: ${{ steps.resolve.outputs.precompile_digest }}
          VERSION_TAG: ${{ steps.resolve.outputs.version_tag }}
          OCI_REFERENCE: ${{ steps.resolve.outputs.oci_reference }}
          VERSION: ${{ steps.resolve.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERSION_REF: ${{ github.ref_name }}
        run: |
          # Pull and stage the host payload in the build context. The
          # Dockerfile expects ./host-payload-staging/ at the project root.
          mkdir -p host-payload-staging
          host_record="$(awk -F '|' '$1=="android-host" {print; found=1; exit} END {if (!found) exit 1}' "$GITHUB_WORKSPACE/manifest/host-artifacts.lock")"
          IFS='|' read -r _ _ host_url host_sha256 _ <<<"$host_record"
          host_archive="$GITHUB_WORKSPACE/${host_url##*/}"
          curl --fail --location --retry 3 --output "$host_archive" "$host_url"
          actual_sha="$(sha256sum "$host_archive" | awk '{print $1}')"
          [[ "$actual_sha" == "$host_sha256" ]] \
            || { echo "Host payload checksum mismatch" >&2; exit 1; }
          tar -xf "$host_archive" -C host-payload-staging             && ls -la host-payload-staging/             && file "$host_archive"

          # The release image is the immutable X.Y.Z (or :main for non-tag
          # pushes). Tag it locally under that ref so the release workflow
          # does not have to overwrite the floating :precompile tag the
          # precompile workflow uses as input.
          release_reference="${OCI_REFERENCE%:*}:${VERSION_TAG}"
          docker buildx build \
              --platform linux/arm64 \
              --pull=false \
              --tag "$release_reference" \
              --build-arg "ARCHLINUXARM_BASE=ghcr.io/btwiuse/arch:base-aarch64" \
              --build-arg "PRECOMPILE_REFERENCE=$PRECOMPILE_REFERENCE" \
              --build-arg "VERSION=$VERSION" \
              --build-arg "OCI_MANIFEST_DIGEST=$PRECOMPILE_DIGEST" \
              --label "org.opencontainers.image.title=Omarchy Android" \
              --label "org.opencontainers.image.version=$VERSION" \
              --file builder/ci/Dockerfile.release \
              "$GITHUB_WORKSPACE"
          docker push "$release_reference"
          # Generate the package inventory from the published image. The
          # release workflow used to inherit this from the legacy
          # build-image pipeline; assemble-bundle.sh needs the lock on
          # disk to verify the bundle against the expected runtime closure.
          mkdir -p image-output
          docker run --rm --platform linux/arm64 "$release_reference" \
              /bin/sh -c 'pacman -Q | LC_ALL=C sort' \
              2> image-output/packages-aarch64-$VERSION.stderr \
              > image-output/packages-aarch64-$VERSION.lock \
            || { echo 'failed to extract package inventory; stderr was:' >&2 \
                 && cat image-output/packages-aarch64-$VERSION.stderr >&2; }
          # Mirror under stable, well-known names so install URLs are easy
          # to spell. :latest tracks the most recent release-built image;
          # :release mirrors :main under a name that signals "the release
          # pipeline built this"; :vX.Y.Z is only added when the run was
          # triggered by a v-tag push.
          docker tag "$release_reference" "${OCI_REFERENCE%:*}:latest"
          docker push "${OCI_REFERENCE%:*}:latest"
          docker tag "$release_reference" "${OCI_REFERENCE%:*}:release"
          docker push "${OCI_REFERENCE%:*}:release"
          if [[ "${VERSION_REF:-}" == v* ]]; then
            vtag="${VERSION_REF}"
            docker tag "$release_reference" "ghcr.io/${GITHUB_REPOSITORY}:${vtag}"
            docker push "ghcr.io/${GITHUB_REPOSITORY}:${vtag}"
          fi
          published_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$release_reference" | sed -e 's/^[^@]*@//')"
          printf 'release_image_digest=%s\n' "$published_digest" >> "$GITHUB_OUTPUT"
          printf 'release_reference=%s\n' "$release_reference" >> "$GITHUB_OUTPUT"
          # Extract the host payload that the Dockerfile staged inside the
          # image at /opt/host-payload-staging/. The image is the canonical
          # source - pulling the host payload from the build context
          # before the OCI ref exists is not reproducible.
          mkdir -p image-output/host
          docker create --name release-host-tmp --platform linux/arm64 \
              "$release_reference" /bin/true >/dev/null
          docker cp release-host-tmp:/opt/host-payload-staging/. image-output/host/ \
            >/dev/null
          docker rm --force release-host-tmp >/dev/null

      - name: Assemble host bundle and publish GH release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          OCI_REFERENCE: ${{ steps.resolve.outputs.oci_reference }}
        run: |
          tag="v$VERSION"
          # The host payload bundle and its sha256 sidecar are published
          # under version-independent asset names. The release tag in the
          # URL already carries the version, so per-version filenames only
          # added clutter to the GH release page and made older releases
          # harder to find by hand. The local on-disk paths in
          # .work/ci-release-$VERSION/ stay versioned so the build context
          # remains self-describing.
          asset="omarchy-android-host-aarch64.tar.xz"
          sidecar_asset="omarchy-android-host-aarch64.tar.xz.sha256"
          local_asset="omarchy-android-host-aarch64-$VERSION.tar.xz"
          local_sidecar_asset="omarchy-android-host-aarch64-$VERSION.tar.xz.sha256"
          mkdir -p release
          base_repository="$(awk -F'|' '$1=="archlinuxarm" {print $2}' "$GITHUB_WORKSPACE/manifest/oci-images.lock")"
          base_tag="$(awk -F'|' '$1=="archlinuxarm" {print $3}' "$GITHUB_WORKSPACE/manifest/oci-images.lock")"
          base_manifest="$(awk -F'|' '$1=="archlinuxarm" {print $4}' "$GITHUB_WORKSPACE/manifest/oci-images.lock")"
          base_layer="$(awk -F'|' '$1=="archlinuxarm" {print $5}' "$GITHUB_WORKSPACE/manifest/oci-images.lock")"
          printf 'format=2\nversion=%s\narchitecture=aarch64\n' "$VERSION" > image-output/IMAGE-MANIFEST
          printf 'oci_repository=%s\n' "${OCI_REFERENCE%:*}" >> image-output/IMAGE-MANIFEST
          printf 'oci_reference=%s\n' "$OCI_REFERENCE" >> image-output/IMAGE-MANIFEST
          printf 'base_repository=%s\n' "$base_repository" >> image-output/IMAGE-MANIFEST
          printf 'base_tag=%s\n' "$base_tag" >> image-output/IMAGE-MANIFEST
          printf 'base_manifest=%s\n' "$base_manifest" >> image-output/IMAGE-MANIFEST
          printf 'base_layer=%s\n' "$base_layer" >> image-output/IMAGE-MANIFEST
          ./builder/ci/assemble-bundle.sh \
            "$VERSION" \
            "$GITHUB_WORKSPACE/image-output/" \
            "$GITHUB_WORKSPACE/.work/ci-release-$VERSION"

          bundle="$GITHUB_WORKSPACE/.work/ci-release-$VERSION/$local_asset"
          sidecar="$GITHUB_WORKSPACE/.work/ci-release-$VERSION/$local_sidecar_asset"
          # Stage the host bundle and its sha256 sidecar under their
          # unversioned remote names so a plain `gh release upload`
          # (which uses the basename of the path as the asset name)
          # publishes them with the right filename. assemble-bundle.sh
          # leaves them on disk under versioned filenames; the gh CLI's
          # <file>#<name> syntax is a display label, not an asset
          # filename rename, so the only portable way to rename is to
          # copy the bytes to a new path before upload. The versioned
          # local copies are kept because they are what assemble-bundle
          # checksums are pinned against.
          bundle_remote="$GITHUB_WORKSPACE/.work/ci-release-$VERSION/$asset"
          sidecar_remote="$GITHUB_WORKSPACE/.work/ci-release-$VERSION/$sidecar_asset"
          cp -f "$bundle" "$bundle_remote"
          cp -f "$sidecar" "$sidecar_remote"
          packages_lock="image-output/packages-aarch64-$VERSION.lock"
          # The packages inventory is published under a version-independent
          # asset name so each release overwrites the previous one in place
          # instead of accumulating a per-version asset name. Users diffing
          # against upstream Omarchy Quattro's install/omarchy-base.packages
          # always look at the latest release's inventory; the per-version
          # filename added no value. assemble-bundle.sh still installs the
          # versioned copy inside the host bundle at
          # manifest/packages-aarch64-$VERSION.lock so version-locked
          # archives remain self-describing.
          packages_asset="omarchy-android-packages-aarch64.lock"

          # The captured pacman -Q inventory is what users diff against
          # omacom/omarchy's install/omarchy-base.packages and
          # install/omarchy-other.packages on the quattro release. Without it,
          # anyone auditing the release has no way to tell whether the
          # release image drifted from upstream Omarchy without unpacking
          # the image themselves. assemble-bundle.sh installs it inside
          # the host bundle at manifest/packages-aarch64-$VERSION.lock
          # already; we publish it as a separate release asset so it's
          # discoverable from the GitHub release page directly.
          if [[ -s "$packages_lock" ]]; then
            cp "$packages_lock" "$GITHUB_WORKSPACE/.work/ci-release-$VERSION/$packages_asset"
          else
            printf 'WARN: %s missing or empty; skipping %s release asset.\n' \
              "$packages_lock" "$packages_asset" >&2
            packages_lock=undefined
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # When updating an existing release, only upload assets that are
            # absent or whose digest matches the local copy. The host bundle
            # and sha256 sidecar share the same invariant as the captured
            # package inventory: never overwrite a remote asset whose
            # digest differs from what we just built. The local-to-remote
            # staging copy is what gets uploaded; the digest check uses
            # the staged copy so the comparison is against the bytes that
            # actually shipped.
            for pair in \
              "$bundle_remote|$asset" \
              "$sidecar_remote|$sidecar_asset"; do
              local_path="${pair%|*}"
              remote_name="${pair#*|}"
              remote_digest="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq ".assets[] | select(.name == \"$remote_name\") | .digest")"
              if [[ -z "$remote_digest" ]]; then
                gh release upload "$tag" "$local_path" --repo "$GITHUB_REPOSITORY"
              elif [[ "$remote_digest" != "sha256:$(sha256sum "$local_path" | awk '{print $1}')" ]]; then
                printf 'Refusing to replace mismatched release asset %s.\n' "$remote_name" >&2
                exit 1
              fi
            done
            if [[ "$packages_lock" != "undefined" ]]; then
              packages_path="$GITHUB_WORKSPACE/.work/ci-release-$VERSION/$packages_asset"
              remote_digest="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq ".assets[] | select(.name == \"$packages_asset\") | .digest")"
              if [[ -z "$remote_digest" ]]; then
                gh release upload "$tag" "$packages_path" --repo "$GITHUB_REPOSITORY"
              elif [[ "$remote_digest" != "sha256:$(sha256sum "$packages_path" | awk '{print $1}')" ]]; then
                printf 'Refusing to replace mismatched release asset %s.\n' "$packages_asset" >&2
                exit 1
              fi
            fi
          else
            notes_file="$(mktemp)"
            cat > "$notes_file" <<EOF
          Precompiled Omarchy Android $tag for ARM64 phones and tablets.

          The guest rootfs is published as an OCI image; proot-distro fetches and unpacks it directly from GitHub Container Registry. The host payload archive above contains only the Android-side helpers (Termux Weston module, two native helpers, licenses).

          The \`omarchy-android-packages-aarch64.lock\` asset is the captured \`pacman -Q\` inventory of the published image. Compare it against the upstream Omarchy Quattro \`install/omarchy-base.packages\` and \`install/omarchy-other.packages\` lists to see exactly what the Android port includes or omits (kernel, ISO builder, laptop-specific hardware, etc. are intentionally absent). The asset name is unversioned because each release overwrites the previous one in place; the versioned copy is still embedded inside the host bundle at \`manifest/packages-aarch64-$VERSION.lock\`.

          Users do not compile Mesa, Hyprland, Weston, or Omarchy. Follow the README from the top, then run the installer.

          This is an unofficial port; upstream project licenses and trademarks remain with their owners.
          EOF
            # First-time release: the host bundle and its sha256 sidecar are
            # already staged under their unversioned remote names above
            # (see the cp lines just after bundle/sidecar are set), so
            # upload them by path. The packages inventory has always
            # lived at the unversioned name in this staging dir.
            upload_args=(
              "$tag"
              "$bundle_remote"
              "$sidecar_remote"
            )
            if [[ "$packages_lock" != "undefined" ]]; then
              upload_args+=("$GITHUB_WORKSPACE/.work/ci-release-$VERSION/$packages_asset")
            fi
            gh release create "${upload_args[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --latest \
              --title "Omarchy Android $tag" \
              --notes-file "$notes_file"
            rm "$notes_file"
          fi

          printf 'host_bundle_asset=%s\n' "$asset" >> "$GITHUB_ENV"