name: Build ARM64 image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version label (letters, digits, dots, dashes, underscores)
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - .github/workflows/build-image.yml
      - builder/**
      - licenses/**
      - manifest/**
      - patches/**
      - runtime/guest/**
      - scripts/**
      - lib/**

permissions:
  contents: read

concurrency:
  group: arm64-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      version: ${{ steps.version.outputs.value }}
      release: ${{ steps.version.outputs.release }}
      manifest_digest: ${{ steps.push.outputs.manifest_digest }}
      oci_reference: ${{ steps.push.outputs.oci_reference }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Select image version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
            release=true
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
            release=false
          else
            version="edge-${GITHUB_SHA:0:12}"
            release=false
          fi
          [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]]
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"

      - name: Report native runner capacity
        run: |
          uname -a
          docker version
          df -h /

      - name: Rebuild sanitized ARM64 OCI image
        id: build
        run: ./builder/ci/build-rootfs.sh "${{ steps.version.outputs.value }}"

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push OCI image to GitHub Container Registry
        id: push
        env:
          VERSION: ${{ steps.version.outputs.value }}
          IMAGE_LOCAL: omarchy-android-ci:${{ steps.version.outputs.value }}
          REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          oci_reference="${REPOSITORY}:${VERSION}"
          docker tag "$IMAGE_LOCAL" "$oci_reference"
          docker push "$oci_reference"
          manifest_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$oci_reference" \
            | sed -e 's/^[^@]*@//')"
          printf 'manifest_digest=%s\n' "$manifest_digest" >> "$GITHUB_OUTPUT"
          printf 'oci_reference=%s\n' "$oci_reference" >> "$GITHUB_OUTPUT"

      - name: Assemble host payload bundle (no rootfs tarball)
        if: steps.version.outputs.release == 'true'
        run: |
          version="${{ steps.version.outputs.value }}"
          ./builder/ci/assemble-bundle.sh \
            "$version" \
            "$GITHUB_WORKSPACE/.work/ci-image-$version/output" \
            "$GITHUB_WORKSPACE/.work/ci-release-$version"

      - name: Upload package drift evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: package-drift-${{ steps.version.outputs.value }}
          path: .work/ci-image-${{ steps.version.outputs.value }}/output/packages-aarch64-*.lock
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload OCI image, manifest, inventory, and checksums
        uses: actions/upload-artifact@v7
        with:
          name: omarchy-android-rootfs-${{ steps.version.outputs.value }}
          path: .work/ci-image-${{ steps.version.outputs.value }}/output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload host payload bundle for publication
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: omarchy-android-release-${{ steps.version.outputs.value }}
          path: .work/ci-release-${{ steps.version.outputs.value }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish installable release
    needs: image
    if: needs.image.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download host payload bundle
        uses: actions/download-artifact@v8
        with:
          name: omarchy-android-release-${{ needs.image.outputs.version }}
          path: release

      - name: Download OCI image artifact
        uses: actions/download-artifact@v8
        with:
          name: omarchy-android-rootfs-${{ needs.image.outputs.version }}
          path: image-output

      - name: Verify host payload and digest-pinned OCI image
        env:
          VERSION: ${{ needs.image.outputs.version }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.image.outputs.manifest_digest }}
          EXPECTED_OCI_REFERENCE: ${{ needs.image.outputs.oci_reference }}
        run: |
          asset="omarchy-android-host-aarch64-$VERSION.tar.xz"
          cd release
          [[ -f "$asset" && -f "$asset.sha256" ]]
          sha256sum -c "$asset.sha256"
          tar -tf "$asset" > bundle-members.txt
          while IFS= read -r member; do
            case "$member" in
              /*|../*|*/../*|*/..) printf 'Unsafe release member: %s\n' "$member" >&2; exit 1 ;;
            esac
          done < bundle-members.txt
          for required in \
            ./BUNDLE-MANIFEST \
            ./SHA256SUMS \
            ./host/bin/omarchy-process-guard \
            ./host/bin/omarchy-x11-keyboard \
            ./host/opt/weston/lib/libweston-14/x11-backend.so; do
            grep -qxF "$required" bundle-members.txt
          done
          rm bundle-members.txt

          # Pull the published image by digest and compare with what CI built.
          # This proves the bytes the installer will receive match what CI
          # tested, with no chance of a tag mutation since publishing.
          cd "$GITHUB_WORKSPACE"
          digest_reference="${EXPECTED_OCI_REFERENCE%:*}@${EXPECTED_MANIFEST_DIGEST}"
          docker pull "$digest_reference"
          published_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$digest_reference" \
            | sed -e 's/^[^@]*@//')"
          [[ "$published_digest" == "$EXPECTED_MANIFEST_DIGEST" ]] || {
            printf 'Published digest drifted: expected %s, got %s\n' \
              "$EXPECTED_MANIFEST_DIGEST" "$published_digest" >&2
            exit 1
          }
          docker save -o image-output/verified.oci.tar "$digest_reference"
          tar -tf image-output/verified.oci.tar > oci-members.txt
          for required in oci-layout index.json manifest.json; do
            tar -tf image-output/verified.oci.tar | grep -qxF "$required" \
              || { printf 'OCI tarball missing %s\n' "$required" >&2; exit 1; }
          done
          rm oci-members.txt

      - name: Publish host payload as a GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          tag="v$VERSION"
          asset="omarchy-android-host-aarch64-$VERSION.tar.xz"
          bundle="$GITHUB_WORKSPACE/release/$asset"
          sidecar="$bundle.sha256"
          bundle_sha256="$(sha256sum "$bundle")"
          bundle_sha256="${bundle_sha256%% *}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for path in "$bundle" "$sidecar"; do
              name="${path##*/}"
              remote_digest="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq ".assets[] | select(.name == \"$name\") | .digest")"
              if [[ -z "$remote_digest" ]]; then
                gh release upload "$tag" "$path" --repo "$GITHUB_REPOSITORY"
              elif [[ "$remote_digest" != "sha256:$(sha256sum "$path" | awk '{print $1}')" ]]; then
                printf 'Refusing to replace mismatched release asset %s.\n' "$name" >&2
                exit 1
              fi
            done
          else
            notes_file="$(mktemp)"
            cat > "$notes_file" <<EOF
          Precompiled Omarchy Android $tag for ARM64 phones and tablets.

          The guest rootfs is published as an OCI image; proot-distro fetches, verifies, and unpacks it directly from GitHub Container Registry. The host payload archive above contains only the Android-side helpers (Termux Weston module, two native helpers, licenses). The installer verifies both before use.

          Users do not compile Mesa, Hyprland, Weston, or Omarchy. Follow the README from the top, then run the installer.

          This is an unofficial port; upstream project licenses and trademarks remain with their owners.
          EOF
            gh release create "$tag" "$bundle" "$sidecar" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --latest \
              --title "Omarchy Android $tag" \
              --notes-file "$notes_file"
            rm "$notes_file"
          fi

          remote_digest="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")"
          [[ "$remote_digest" == "sha256:$bundle_sha256" ]]
          printf 'host_bundle_sha256=%s\n' "$bundle_sha256" >> "$GITHUB_ENV"
          printf 'host_bundle_asset=%s\n' "$asset" >> "$GITHUB_ENV"

      - name: Point the installer at the published OCI release
        env:
          VERSION: ${{ needs.image.outputs.version }}
          OCI_REFERENCE: ${{ needs.image.outputs.oci_reference }}
          OCI_MANIFEST_DIGEST: ${{ needs.image.outputs.manifest_digest }}
          HOST_BUNDLE_ASSET: omarchy-android-host-aarch64-${{ needs.image.outputs.version }}.tar.xz
        run: |
          default_branch="$(git symbolic-ref --short refs/remotes/origin/HEAD \
            | sed 's|^origin/||')"
          : "${default_branch:=main}"
          git fetch --depth 1 origin "$default_branch"
          git switch --force-create "$default_branch" "origin/$default_branch"
          ./scripts/update-release-lock.sh \
            "$VERSION" \
            "$GITHUB_REPOSITORY" \
            "$OCI_REFERENCE" \
            "$OCI_MANIFEST_DIGEST" \
            "$HOST_BUNDLE_ASSET" \
            "$(awk -F= '$1=="host_artifact_sha256" {print $2}' \
              "$GITHUB_WORKSPACE/release/BUNDLE-MANIFEST")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest/release.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Point installer at v$VERSION"
          git push origin "HEAD:$default_branch"
