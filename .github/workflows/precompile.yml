name: Precompile ARM64 OCI image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/precompile.yml
      - .github/workflows/release.yml
      - builder/**
      - licenses/**
      - manifest/**
      - patches/**
      - runtime/guest/**
      - scripts/**
      - lib/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: arm64-precompile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Report native runner capacity
        run: |
          uname -a
          docker version
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild sanitized ARM64 OCI image
        run: |
          version="precompile-${GITHUB_SHA:0:12}"
          ./builder/ci/build-rootfs.sh "$version"

      - name: Smoke-test the published precompile image
        env:
          PRECOMPILE_REFERENCE: ghcr.io/${{ github.repository }}:precompile
        run: |
          # Confirm the image we just published carries every artifact the
          # installer expects. This catches a broken Dockerfile before the
          # release workflow trusts the image.
          docker pull --platform linux/arm64 "$PRECOMPILE_REFERENCE"
          # Capture both stdout and stderr to diagnose which assertion fails.
          if ! docker run --rm --platform linux/arm64 "$PRECOMPILE_REFERENCE" /bin/sh -c '
            set -eu
            test -f /etc/omarchy-android-release
            test -x /opt/omarchy-android/hyprland/bin/Hyprland
            test -f /home/omarchy/.config/hypr/hyprland.lua
            test -f /home/omarchy/.config/omarchy/proot-session-bus.conf
            test -x /usr/local/bin/omarchy-dbus-service
            test -x /usr/local/bin/voxtype
            test -f /usr/share/omarchy/LICENSE
            command -v quickshell chromium nautilus foot uwsm-app omarchy-launch-shell
            locale -a | grep -Fxi "C.utf8"
          '; then
            echo "--- Diagnostics: dumping precompile top-level ---"
            docker run --rm --platform linux/arm64 "$PRECOMPILE_REFERENCE" /bin/sh -c '
              echo "/etc/omarchy-android-release:"
              cat /etc/omarchy-android-release 2>&1 | head -5 || true
              echo "/opt/omarchy-android listing:"
              ls /opt/omarchy-android 2>&1 || true
              echo "/usr/local/bin listing:"
              ls /usr/local/bin 2>&1 | head -10 || true
              echo "/usr/share/omarchy listing:"
              ls /usr/share/omarchy 2>&1 | head -10 || true
            '
            exit 1
          fi