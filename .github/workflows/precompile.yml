name: Precompile ARM64 OCI image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/precompile.yml
      - .github/workflows/release.yml
      - builder/**
      - licenses/**
      - manifest/**
      - patches/**
      - runtime/guest/**
      - scripts/**
      - lib/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: arm64-precompile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install host validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Report native runner capacity
        run: |
          uname -a
          docker version
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild sanitized ARM64 OCI image
        run: |
          version="precompile-${GITHUB_SHA:0:12}"
          ./builder/ci/build-rootfs.sh "$version"

      - name: Smoke-test the published precompile image
        env:
          PRECOMPILE_REFERENCE: ghcr.io/${{ github.repository }}:precompile
        run: |
          # The precompile stage produces a toolchain image with compiled
          # graphics; it does not perform final assembly. Smoke-test only
          # what the precompile stage promises: the compiled artifact is
          # present and the source roots are imported. Final release-image
          # assertions belong to release.yml.
          docker pull --platform linux/arm64 "$PRECOMPILE_REFERENCE"
          docker run --rm --platform linux/arm64 "$PRECOMPILE_REFERENCE" /bin/sh -c '
            set -eu
            test -f /opt/omarchy-android/SHA256SUMS
            test -x /opt/omarchy-android/hyprland/bin/Hyprland
            test -f /opt/omarchy-android/mesa/freedreno_icd.json
            test -f /opt/omarchy-android/aquamarine/lib/libaquamarine.so
            # Toolchain layer must NOT carry the final release artifacts; those
            # are added by Dockerfile.release on top of this base.
            test ! -f /etc/omarchy-android-release
            test ! -x /usr/local/bin/omarchy-dbus-service
          '